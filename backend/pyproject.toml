[project]
name = "explore-hyderabad-api"
version = "1.0.0"
description = "FastAPI backend for Explore Hyderabad tourism and city exploration platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "email-validator>=2.1.1",
  "pydantic-settings>=2.3.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "geoalchemy2>=0.14.7",
  "psycopg[binary]>=3.1.19",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "redis>=5.0.4",
  "celery>=5.4.0",
  "httpx>=0.27.0",
  "openai>=1.35.0",
  "slowapi>=0.1.9",
  "structlog>=24.1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.7", "ruff>=0.4.0", "mypy>=1.10.0"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
